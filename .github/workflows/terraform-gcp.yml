name: Terraform GCP Infrastructure

on:
  push:
    branches: [ main ]
    paths:
      - 'infrastructure/gcp/**'
      - '.github/workflows/terraform-gcp.yml'

jobs:
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: infrastructure/gcp

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Google Auth
      uses: 'google-github-actions/auth@v2'
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Terraform Init
      run: terraform init

    - name: Terraform Plan
      run: |
        terraform plan 
          -var="project_id=${{ secrets.GCP_PROJECT_ID }}" 
          -var="google_api_key=${{ secrets.GOOGLE_API_KEY }}" 
          -var="supabase_url=${{ secrets.SUPABASE_URL }}" 
          -var="supabase_key=${{ secrets.SUPABASE_KEY }}"

    - name: Terraform Apply
      if: github.ref == 'refs/heads/main'
      run: |
        terraform apply -auto-approve 
          -var="project_id=${{ secrets.GCP_PROJECT_ID }}" 
          -var="google_api_key=${{ secrets.GOOGLE_API_KEY }}" 
          -var="supabase_url=${{ secrets.SUPABASE_URL }}" 
          -var="supabase_key=${{ secrets.SUPABASE_KEY }}"
